<!-- 3. JavaScript 逻辑 (控制按钮点击) -->
<script>
  function slideGallery(direction) {
    const gallery = document.getElementById('myGallery');
    // 获取容器的宽度，即每次滚动的距离 (滑动一张图片的宽度)
    const scrollAmount = gallery.clientWidth; 
    
    // 执行平滑滚动
    gallery.scrollBy({
      left: direction * scrollAmount,
      behavior: 'smooth'
    });
  }
</script>
